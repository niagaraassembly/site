# On the `issues` event, actions/checkout@v4 checks out the repository's
# default branch, not any feature branch. This workflow writes to whatever
# branch is default at run time, so it is only live once this work has been
# merged there.
name: Approve request
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: write-data
  # Never cancel an in-flight write: cancelling mid-run would drop the very
  # record it was in the middle of committing.
  cancel-in-progress: false
jobs:
  write:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write, commit and push
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Spec §8.3: both labels are required for a comment to be published.
          # `approved` gates the job; `publish-comment` gates the comment text.
          PUBLISH_COMMENT: ${{ contains(github.event.issue.labels.*.name, 'publish-comment') }}
        run: |
          git config user.name "niagara-assembly-bot"
          git config user.email "noreply@niagaraassembly.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python3 scripts/approve_request.py || exit 1
            git add data/
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Add record from #${{ github.event.issue.number }}"
            if git push; then exit 0; fi
            echo "push rejected; re-deriving against latest (attempt $attempt)"
            sleep $((RANDOM % 5 + 2))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
