# Fires when a label is added to an issue. Two independent jobs, each
# gated on the issue also carrying its pipeline's label — so approving a
# board post never touches the org, and approving an open-source
# registration never touches data/.
#
# On the `issues` event, actions/checkout@v4 checks out the repository's
# DEFAULT branch, not any feature branch. This workflow writes to whatever
# branch is default at run time, so it is only live once merged there.
name: Approve request
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write

jobs:
  write:
    name: Publish to the board
    if: >-
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'board')
    runs-on: ubuntu-latest
    concurrency:
      group: write-data
      # Never cancel an in-flight write: cancelling mid-run would drop the
      # very record it was in the middle of committing.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Write, commit and push
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Stamped onto the record so a later member comment can find it.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "niagara-assembly-bot"
          git config user.email "noreply@niagaraassembly.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python3 scripts/approve_request.py || exit 1
            git add data/
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Add board record from #${{ github.event.issue.number }}"
            if git push; then exit 0; fi
            echo "push rejected; re-deriving against latest (attempt $attempt)"
            sleep $((RANDOM % 5 + 2))
          done
          echo "could not push after 5 attempts" >&2
          exit 1

      - name: Say what happened, then close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
              --body "Published to the board."
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
              --body "Publishing failed — see the run log. The issue stays open."
          fi

  invite:
    name: Invite to the organization
    if: >-
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'opensource')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Actions token cannot invite org members — it returns 403. The
      # credential is a GitHub App installed on the org rather than a
      # personal token, so it belongs to no individual, cannot expire out
      # from under the pipeline, and shows in the audit log as itself.
      - name: Check the App credentials are present
        env:
          APP_ID: ${{ secrets.INVITE_APP_ID }}
          APP_KEY: ${{ secrets.INVITE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID:-}" ] || [ -z "${APP_KEY:-}" ]; then
            echo "INVITE_APP_ID / INVITE_APP_PRIVATE_KEY are not set on this repo." >&2
            echo "Create a GitHub App on the niagaraassembly org with organization" >&2
            echo "permission Members: Read and write, install it, and store its App" >&2
            echo "ID and private key as those two repository secrets." >&2
            exit 1
          fi

      # Pinned to a commit SHA, not a tag: a tag can be moved to point at
      # different code, and this step is handed the App's private key.
      - name: Mint a short-lived installation token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.INVITE_APP_ID }}
          private-key: ${{ secrets.INVITE_APP_PRIVATE_KEY }}
          owner: niagaraassembly

      - name: Invite
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Expires in an hour, and only ever exists inside this run.
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail

          # One line on purpose: a multi-line heredoc here sits at column
          # zero and breaks the enclosing YAML block scalar.
          USERNAME="$(python3 -c 'import os,sys; sys.path.insert(0,"scripts"); from approve_request import extract_block; print(extract_block(os.environ["ISSUE_BODY"]).get("github_username",""))')"

          # Validated a third time. The browser check is advice, the Apps
          # Script check is advice, and this value reaches a command line.
          if ! printf '%s' "$USERNAME" | grep -qE '^[A-Za-z0-9]([A-Za-z0-9]|-[A-Za-z0-9]){0,38}$'; then
            echo "refusing to invite: '$USERNAME' is not a valid GitHub username" >&2
            exit 1
          fi

          gh api --method PUT "orgs/niagaraassembly/memberships/${USERNAME}" -f role=member

      - name: Say what happened, then close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
              --body "Organization invitation sent."
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
              --body "Invitation failed — see the run log. The issue stays open."
          fi

  comment:
    name: Publish a member comment
    # author_association is GitHub's own answer to "who is this person to
    # this repo", evaluated server-side — it cannot be spoofed by the
    # comment body. MEMBER is an org member; OWNER is an org owner.
    # Anyone else commenting on a public issue is simply ignored.
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.labels.*.name, 'board') &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    concurrency:
      # Shares the publish job's group: both write data/board.json, and two
      # runs racing would lose one of the writes.
      group: write-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Attach, commit and push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config user.name "niagara-assembly-bot"
          git config user.email "noreply@niagaraassembly.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python3 scripts/add_comment.py || exit 1
            git add data/
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Add comment from #${{ github.event.issue.number }}"
            if git push; then exit 0; fi
            echo "push rejected; re-deriving against latest (attempt $attempt)"
            sleep $((RANDOM % 5 + 2))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
