<script type="module">

import {
  navHtml,
  subnavHtml,
  mountBoard,
  parseQuery
} from '../assets/js/board.js';

import {
  locationsIn,
  hasOffer
} from '../assets/js/nav.js';


/* ------------------------------------------------------------------
 * Board state
 * ---------------------------------------------------------------- */

const root = document.getElementById('board');
const nav = document.getElementById('nav');
const subnav = document.getElementById('subnav');
const filters = document.getElementById('filters');

let records = [];
let state = parseQuery(location.search);


/* ------------------------------------------------------------------
 * Text normalization
 *
 * Board records ultimately originate in a GitHub issue. Depending
 * on where the text has passed through, a line break can arrive as:
 *
 *   actual newline
 *   "\\n"
 *   "/n"
 *
 * Normalize the latter two here so every downstream renderer gets
 * a real newline character.
 * ---------------------------------------------------------------- */

function normalizeText(value) {
  if (typeof value !== 'string') return value;

  return value
    .replace(/\\n/g, '\n')
    .replace(/\/n/g, '\n')
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n');
}


function normalizeRecord(record) {
  const normalized = {};

  for (const [key, value] of Object.entries(record || {})) {
    normalized[key] =
      typeof value === 'string'
        ? normalizeText(value)
        : value;
  }

  return normalized;
}


/* ------------------------------------------------------------------
 * Filtering
 * ---------------------------------------------------------------- */

function sinceDate(days) {
  if (!days) return '';

  const d = new Date();
  d.setDate(d.getDate() - Number(days));

  return d.toISOString().slice(0, 10);
}


/* ------------------------------------------------------------------
 * Postcard text helpers
 * ---------------------------------------------------------------- */

function postcardValue(value) {
  return normalizeText(
    value == null ? '' : String(value)
  ).trim();
}


function addPostcardButton(card, record) {
  if (!card || !record) return;

  if (card.querySelector('.board-postcard')) {
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'board-postcard';

  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'board-postcard__button';
  button.textContent = 'Create postcard';

  button.addEventListener('click', async () => {
    button.disabled = true;

    try {
      await createPostcard(record);
    } catch (err) {
      console.error('postcard:', err);
      alert('The postcard could not be created.');
    } finally {
      button.disabled = false;
    }
  });

  wrap.appendChild(button);
  card.appendChild(wrap);
}


/* ------------------------------------------------------------------
 * Find the rendered card corresponding to a Board record
 * ---------------------------------------------------------------- */

function findCardForRecord(record) {
  const title = postcardValue(record.title);

  if (!title) return null;

  const candidates = root.querySelectorAll(
    'article, li, section, .card, [class*="card"]'
  );

  for (const candidate of candidates) {
    if (candidate.textContent.includes(title)) {
      return candidate;
    }
  }

  return null;
}


/* ------------------------------------------------------------------
 * Install postcard controls
 * ---------------------------------------------------------------- */

function installPostcardButtons() {
  for (const record of records) {
    const card = findCardForRecord(record);

    if (card) {
      addPostcardButton(card, record);
    }
  }
}


/* ------------------------------------------------------------------
 * Canvas helpers
 * ---------------------------------------------------------------- */

function canvasRoundRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);

  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(
    x + w,
    y + h,
    x + w - radius,
    y + h
  );
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(
    x,
    y + h,
    x,
    y + h - radius
  );
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}


/* ------------------------------------------------------------------
 * Word wrapping
 * ---------------------------------------------------------------- */

function wrapText(ctx, text, maxWidth) {
  const paragraphs = postcardValue(text).split('\n');
  const lines = [];

  for (const paragraph of paragraphs) {

    if (!paragraph.trim()) {
      lines.push('');
      continue;
    }

    const words = paragraph.split(/\s+/);
    let line = '';

    for (const word of words) {
      const test = line ? line + ' ' + word : word;

      if (ctx.measureText(test).width <= maxWidth) {
        line = test;
        continue;
      }

      if (line) {
        lines.push(line);
      }

      /*
       * If one individual word is wider than the available width,
       * break it rather than allowing it to overflow the postcard.
       */
      if (ctx.measureText(word).width <= maxWidth) {
        line = word;
      } else {
        let part = '';

        for (const char of word) {
          const testPart = part + char;

          if (
            ctx.measureText(testPart).width <= maxWidth
          ) {
            part = testPart;
          } else {
            if (part) lines.push(part);
            part = char;
          }
        }

        line = part;
      }
    }

    if (line) {
      lines.push(line);
    }
  }

  return lines;
}


function drawWrappedText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight,
  maxLines = Infinity
) {
  const lines = wrapText(ctx, text, maxWidth);

  let count = 0;

  for (const line of lines) {

    if (count >= maxLines) {
      break;
    }

    if (line) {
      ctx.fillText(line, x, y + count * lineHeight);
    }

    count++;
  }

  return count;
}


/* ------------------------------------------------------------------
 * Postcard data
 *
 * Deliberately include every populated field submitted to the Board.
 * Empty fields simply do not appear.
 * ---------------------------------------------------------------- */

function postcardFields(record) {
  const fields = [];

  const add = (label, key) => {
    const value = postcardValue(record[key]);

    if (value) {
      fields.push({
        label,
        value
      });
    }
  };

  add('Kind', 'kind');
  add('Offering / seeking', 'offer');
  add('Presenter', 'presenter');
  add('When', 'when');
  add('Where', 'where');
  add('Location', 'location');
  add('Specs', 'specs');
  add('Price', 'price');
  add('Description', 'description');
  add('Link', 'link');
  add('Contact', 'contact');

  return fields;
}


/* ------------------------------------------------------------------
 * Draw postcard
 * ---------------------------------------------------------------- */

async function createPostcard(record) {

  const width = 1200;
  const height = 1500;

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext('2d');

  if (!ctx) {
    throw new Error('Canvas is not available.');
  }


  /* --------------------------------------------------------------
   * Base
   * -------------------------------------------------------------- */

  ctx.fillStyle = '#f5f2e9';
  ctx.fillRect(0, 0, width, height);


  /* --------------------------------------------------------------
   * Outer border
   * -------------------------------------------------------------- */

  ctx.strokeStyle = '#171717';
  ctx.lineWidth = 5;
  ctx.strokeRect(34, 34, width - 68, height - 68);


  /* --------------------------------------------------------------
   * Header
   * -------------------------------------------------------------- */

  let y = 92;

  ctx.fillStyle = '#171717';

  ctx.font = '700 30px Arial, Helvetica, sans-serif';
  ctx.fillText('@NiagaraAssembly', 78, y);

  y += 48;

  ctx.font = '700 20px Arial, Helvetica, sans-serif';
  ctx.fillText(
    'TECHNOLOGY  •  INDUSTRY  •  COMMONS',
    78,
    y
  );


  /* --------------------------------------------------------------
   * Category
   * -------------------------------------------------------------- */

  y += 78;

  const category =
    postcardValue(record.category).toUpperCase();

  if (category) {
    ctx.font = '700 22px Arial, Helvetica, sans-serif';
    ctx.fillText(category, 78, y);
  }


  /* --------------------------------------------------------------
   * Title
   * -------------------------------------------------------------- */

  y += 58;

  const title = postcardValue(record.title) || '(untitled)';

  ctx.font = '700 68px Arial, Helvetica, sans-serif';

  const titleLines = wrapText(
    ctx,
    title,
    1044
  );

  for (const line of titleLines.slice(0, 4)) {
    ctx.fillText(line, 78, y);
    y += 78;
  }


  /* --------------------------------------------------------------
   * Information block
   * -------------------------------------------------------------- */

  y += 22;

  const fields = postcardFields(record);

  const labelWidth = 260;
  const valueX = 78 + labelWidth;
  const valueWidth = 1044 - labelWidth;

  ctx.font = '700 22px Arial, Helvetica, sans-serif';

  for (const field of fields) {

    /*
     * Description gets more vertical space and is treated as prose.
     * Everything else gets a compact labelled row.
     */
    if (field.label === 'Description') {

      ctx.font =
        '700 22px Arial, Helvetica, sans-serif';

      ctx.fillText(
        field.label,
        78,
        y
      );

      y += 36;

      ctx.font =
        '400 24px Arial, Helvetica, sans-serif';

      const lines = wrapText(
        ctx,
        field.value,
        1044
      );

      for (const line of lines) {

        if (y > height - 240) {
          break;
        }

        if (line) {
          ctx.fillText(line, 78, y);
        }

        y += 32;
      }

      y += 18;
      continue;
    }


    ctx.font =
      '700 21px Arial, Helvetica, sans-serif';

    ctx.fillText(
      field.label,
      78,
      y
    );


    ctx.font =
      '400 24px Arial, Helvetica, sans-serif';

    const lines = wrapText(
      ctx,
      field.value,
      valueWidth
    );

    let lineY = y;

    for (const line of lines) {

      if (lineY > height - 240) {
        break;
      }

      if (line) {
        ctx.fillText(
          line,
          valueX,
          lineY
        );
      }

      lineY += 31;
    }

    y = Math.max(
      y + 36,
      lineY
    ) + 12;
  }


  /* --------------------------------------------------------------
   * Divider
   * -------------------------------------------------------------- */

  const footerY = height - 190;

  ctx.strokeStyle = '#171717';
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(78, footerY);
  ctx.lineTo(width - 78, footerY);
  ctx.stroke();


  /* --------------------------------------------------------------
   * Link
   * -------------------------------------------------------------- */

  ctx.fillStyle = '#171717';

  ctx.font =
    '700 24px Arial, Helvetica, sans-serif';

  ctx.fillText(
    'Link:',
    78,
    footerY + 52
  );

  const link =
    postcardValue(record.link) ||
    `${location.origin}/board/`;

  ctx.font =
    '400 23px Arial, Helvetica, sans-serif';

  const linkLines = wrapText(
    ctx,
    link,
    900
  );

  let linkY = footerY + 52;

  for (const line of linkLines.slice(0, 2)) {

    ctx.fillText(
      line,
      165,
      linkY
    );

    linkY += 30;
  }


  /* --------------------------------------------------------------
   * Footer branding
   * -------------------------------------------------------------- */

  ctx.font =
    '700 20px Arial, Helvetica, sans-serif';

  ctx.fillText(
    'NIAGARA ASSEMBLY',
    78,
    height - 82
  );

  ctx.font =
    '400 20px Arial, Helvetica, sans-serif';

  ctx.fillText(
    'niagaraassembly.com/board',
    width - 390,
    height - 82
  );


  /* --------------------------------------------------------------
   * JPEG
   * -------------------------------------------------------------- */

  const blob = await new Promise((resolve, reject) => {

    canvas.toBlob(
      result => {
        if (result) {
          resolve(result);
        } else {
          reject(
            new Error('Could not create JPEG.')
          );
        }
      },
      'image/jpeg',
      0.92
    );

  });


  /* --------------------------------------------------------------
   * File
   * -------------------------------------------------------------- */

  const safeTitle =
    title
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 60) ||
    'board-postcard';

  const file =
    new File(
      [blob],
      `${safeTitle}.jpg`,
      { type: 'image/jpeg' }
    );


  /* --------------------------------------------------------------
   * Share if supported
   * -------------------------------------------------------------- */

  if (
    navigator.share &&
    navigator.canShare &&
    navigator.canShare({ files: [file] })
  ) {

    try {

      await navigator.share({
        title:
          title === '(untitled)'
            ? 'Niagara Assembly Board'
            : title,
        text:
          'Posted on the Niagara Assembly Board.',
        files: [file]
      });

      return;

    } catch (err) {

      /*
       * User cancellation is not an error worth surfacing.
       * Fall through to download only for actual share failures.
       */
      if (err && err.name === 'AbortError') {
        return;
      }
    }
  }


  /* --------------------------------------------------------------
   * Download fallback
   * -------------------------------------------------------------- */

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement('a');

  a.href = url;
  a.download = `${safeTitle}.jpg`;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );
}


/* ------------------------------------------------------------------
 * Rendering
 * ---------------------------------------------------------------- */

function render() {

  nav.innerHTML =
    navHtml(state.category);

  subnav.innerHTML =
    subnavHtml(
      state.category,
      state.kind
    );


  const offerSelect =
    document.getElementById('f-offer');

  const showOffer =
    hasOffer(state.category);

  offerSelect.hidden =
    !showOffer;


  if (!showOffer && state.offer) {

    offerSelect.value = '';
    state.offer = '';

  }


  mountBoard(
    records,
    state,
    root
  );


  /*
   * mountBoard() owns the actual card markup.
   *
   * Wait one animation frame so its DOM has been committed, then
   * attach postcard controls to the rendered cards.
   */
  requestAnimationFrame(() => {
    installPostcardButtons();
  });


  if (window.NASketch) {
    window.NASketch.redraw();
  }
}


/* ------------------------------------------------------------------
 * Navigation
 * ---------------------------------------------------------------- */

for (const bar of [nav, subnav]) {

  bar.addEventListener(
    'click',
    (e) => {

      const link =
        e.target.closest('a');

      if (!link) return;

      e.preventDefault();

      history.pushState(
        null,
        '',
        link.getAttribute('href')
      );

      state = {
        ...parseQuery(location.search),
        q: state.q,
        offer: state.offer,
        location: state.location,
        since: state.since,
        upcoming: state.upcoming
      };

      render();
    }
  );
}


/* ------------------------------------------------------------------
 * Filters
 * ---------------------------------------------------------------- */

filters.addEventListener(
  'submit',
  (e) => e.preventDefault()
);


filters.addEventListener(
  'input',
  () => {

    state = {
      ...state,

      q:
        document.getElementById(
          'f-q'
        ).value,

      offer:
        document.getElementById(
          'f-offer'
        ).value,

      location:
        document.getElementById(
          'f-location'
        ).value,

      since:
        sinceDate(
          document.getElementById(
            'f-since'
          ).value
        ),

      upcoming:
        document.getElementById(
          'f-upcoming'
        ).checked
    };

    render();
  }
);


/* ------------------------------------------------------------------
 * Browser history
 * ---------------------------------------------------------------- */

addEventListener(
  'popstate',
  () => {

    state =
      parseQuery(
        location.search
      );

    render();
  }
);


/* ------------------------------------------------------------------
 * Load Board data
 * ---------------------------------------------------------------- */

try {

  records =
    await fetch(
      '../data/board.json'
    ).then(
      async (response) => {

        if (!response.ok) {
          throw new Error(
            `board.json: HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        /*
         * Normalize every string as soon as the Board data enters
         * the page. This means both the normal web Board and the
         * postcard generator receive the same corrected record.
         */
        return Array.isArray(data)
          ? data.map(normalizeRecord)
          : [];
      }
    );


  const select =
    document.getElementById(
      'f-location'
    );


  for (
    const name of locationsIn(records)
  ) {

    const option =
      document.createElement(
        'option'
      );

    option.value = name;
    option.textContent = name;

    select.append(option);
  }


  render();

} catch (err) {

  console.error(err);

  nav.innerHTML =
    navHtml(state.category);

  root.innerHTML =
    '<p class="board__empty">' +
    'The board could not be loaded. Please reload.' +
    '</p>';
}

</script>

</body>
</html>
