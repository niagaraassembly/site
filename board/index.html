<script type="module">

import {
  navHtml,
  subnavHtml,
  mountBoard,
  parseQuery
} from '../assets/js/board.js';

import {
  locationsIn,
  hasOffer
} from '../assets/js/nav.js';


/* ------------------------------------------------------------------
 * Board state
 * ---------------------------------------------------------------- */

const root = document.getElementById('board');
const nav = document.getElementById('nav');
const subnav = document.getElementById('subnav');
const filters = document.getElementById('filters');

let records = [];
let state = parseQuery(location.search);


/* ------------------------------------------------------------------
 * Filtering
 * ---------------------------------------------------------------- */

function sinceDate(days) {
  if (!days) return '';

  const d = new Date();
  d.setDate(d.getDate() - Number(days));

  return d.toISOString().slice(0, 10);
}


/* ------------------------------------------------------------------
 * Rendering
 * ---------------------------------------------------------------- */

function render() {
  nav.innerHTML = navHtml(state.category);
  subnav.innerHTML = subnavHtml(state.category, state.kind);

  const offerSelect = document.getElementById('f-offer');
  const showOffer = hasOffer(state.category);

  offerSelect.hidden = !showOffer;

  if (!showOffer && state.offer) {
    offerSelect.value = '';
    state.offer = '';
  }

  mountBoard(records, state, root);

  /*
   * mountBoard() owns the actual card markup.
   *
   * Once it has finished rendering, add postcard controls to the
   * cards without requiring board.js to know anything about the
   * postcard generator.
   */
  requestAnimationFrame(() => {
    installPostcardButtons();
  });

  if (window.NASketch) {
    window.NASketch.redraw();
  }
}


/* ------------------------------------------------------------------
 * Navigation
 * ---------------------------------------------------------------- */

for (const bar of [nav, subnav]) {

  bar.addEventListener('click', (e) => {

    const link = e.target.closest('a');

    if (!link) return;

    e.preventDefault();

    history.pushState(
      null,
      '',
      link.getAttribute('href')
    );

    state = {
      ...parseQuery(location.search),
      q: state.q,
      offer: state.offer,
      location: state.location,
      since: state.since,
      upcoming: state.upcoming
    };

    render();
  });

}


/* ------------------------------------------------------------------
 * Filters
 * ---------------------------------------------------------------- */

filters.addEventListener(
  'submit',
  (e) => e.preventDefault()
);


filters.addEventListener(
  'input',
  () => {

    state = {
      ...state,

      q: document.getElementById('f-q').value,

      offer:
        document.getElementById('f-offer').value,

      location:
        document.getElementById('f-location').value,

      since:
        sinceDate(
          document.getElementById('f-since').value
        ),

      upcoming:
        document.getElementById('f-upcoming').checked
    };

    render();
  }
);


addEventListener(
  'popstate',
  () => {
    state = parseQuery(location.search);
    render();
  }
);


/* ------------------------------------------------------------------
 * Board postcard system
 *
 * The postcard is generated locally with Canvas.
 *
 * No image-generation service.
 * No server.
 * No uploaded data.
 *
 * Output:
 *   1200 × 1500 JPEG
 * ---------------------------------------------------------------- */

const POSTCARD_WIDTH = 1200;
const POSTCARD_HEIGHT = 1500;


/*
 * Find the rendered card belonging to a record.
 *
 * board.js is deliberately left untouched. We locate the card by
 * looking for its title in the rendered DOM.
 */
function findCardForRecord(record) {

  if (!record) return null;

  const title = String(record.title || '').trim();

  if (!title) return null;

  const candidates = root.querySelectorAll(
    'article, li, .board__item, .board__card, [class*="board"]'
  );

  for (const element of candidates) {

    if (element.dataset.postcardReady === 'true') {
      continue;
    }

    const text = element.textContent || '';

    if (text.includes(title)) {
      return element;
    }
  }

  return null;
}


/*
 * Install one postcard button per visible Board record.
 */
function installPostcardButtons() {

  /*
   * First look for cards that already have a postcard button.
   * This makes the function safe to call repeatedly.
   */
  const existing = new Set(
    [...root.querySelectorAll('[data-postcard-index]')]
      .map(button => button.dataset.postcardIndex)
  );

  records.forEach((record, index) => {

    if (!record) return;

    /*
     * Only add buttons to records currently visible after filtering.
     */
    const card = findCardForRecord(record);

    if (!card) return;

    if (existing.has(String(index))) {
      return;
    }

    if (card.querySelector('.board-postcard')) {
      return;
    }

    card.dataset.postcardReady = 'true';

    const wrapper = document.createElement('div');
    wrapper.className = 'board-postcard';

    const button = document.createElement('button');

    button.type = 'button';
    button.className = 'board-postcard__button';
    button.dataset.postcardIndex = String(index);
    button.textContent = 'Create postcard';
    button.setAttribute(
      'aria-label',
      `Create postcard for ${record.title || 'this listing'}`
    );

    button.addEventListener(
      'click',
      async () => {

        button.disabled = true;
        button.textContent = 'Creating…';

        try {
          await createPostcard(record);
        } catch (error) {

          console.error(
            'postcard:',
            error
          );

          /*
           * Browser security policies can prevent sharing or
           * downloading in unusual circumstances. In either case
           * the user gets a simple visible recovery message.
           */
          button.textContent = 'Postcard failed';

          setTimeout(() => {
            button.disabled = false;
            button.textContent = 'Create postcard';
          }, 1800);

          return;
        }

        button.disabled = false;
        button.textContent = 'Create postcard';
      }
    );

    wrapper.append(button);
    card.append(wrapper);
  });
}


/* ------------------------------------------------------------------
 * Text helpers
 * ---------------------------------------------------------------- */

function cleanText(value) {

  return String(value || '')
    .replace(/\s+/g, ' ')
    .trim();
}


function titleCase(value) {

  const text = cleanText(value);

  if (!text) return '';

  return text
    .replace(/[-_]+/g, ' ')
    .replace(/\b\w/g, letter => letter.toUpperCase());
}


/*
 * Draw text with a maximum width.
 *
 * Returns the Y position after the final line.
 */
function drawWrappedText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight,
  maxLines
) {

  text = cleanText(text);

  if (!text) {
    return y;
  }

  const words = text.split(/\s+/);
  const lines = [];

  let line = '';

  for (const word of words) {

    const test = line
      ? `${line} ${word}`
      : word;

    if (
      ctx.measureText(test).width > maxWidth &&
      line
    ) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }

  if (line) {
    lines.push(line);
  }

  const visibleLines =
    lines.slice(0, maxLines);

  if (lines.length > maxLines) {

    let last =
      visibleLines[visibleLines.length - 1];

    while (
      ctx.measureText(`${last}…`).width > maxWidth &&
      last.length > 1
    ) {
      last = last.slice(0, -1);
    }

    visibleLines[
      visibleLines.length - 1
    ] = `${last}…`;
  }

  for (const current of visibleLines) {

    ctx.fillText(
      current,
      x,
      y
    );

    y += lineHeight;
  }

  return y;
}


/* ------------------------------------------------------------------
 * Postcard URL
 * ---------------------------------------------------------------- */

function postcardUrl(record) {

  /*
   * Prefer the listing's explicit link.
   */
  if (record.link) {

    try {
      return new URL(
        record.link,
        location.origin
      ).href;
    } catch (e) {
      // Continue to fallback.
    }
  }

  /*
   * Otherwise point back to the Board itself.
   */
  return new URL(
    '/board/',
    location.origin
  ).href;
}


/* ------------------------------------------------------------------
 * Postcard canvas
 * ---------------------------------------------------------------- */

function drawPostcard(record) {

  const canvas =
    document.createElement('canvas');

  canvas.width = POSTCARD_WIDTH;
  canvas.height = POSTCARD_HEIGHT;

  const ctx =
    canvas.getContext('2d');

  /*
   * Use the current site's basic light-paper aesthetic rather than
   * depending on the page's CSS variables. The JPEG must stand on
   * its own once it leaves the website.
   */
  ctx.fillStyle = '#f5f2e9';
  ctx.fillRect(
    0,
    0,
    POSTCARD_WIDTH,
    POSTCARD_HEIGHT
  );


  /*
   * Outer border.
   */
  ctx.strokeStyle = '#171717';
  ctx.lineWidth = 4;

  ctx.strokeRect(
    34,
    34,
    POSTCARD_WIDTH - 68,
    POSTCARD_HEIGHT - 68
  );


  /*
   * Small institutional header.
   */
  ctx.fillStyle = '#171717';

  ctx.font =
    '600 30px Arial, Helvetica, sans-serif';

  ctx.fillText(
    '@NiagaraAssembly',
    85,
    105
  );


  /*
   * Small rule beneath header.
   */
  ctx.beginPath();

  ctx.moveTo(85, 135);
  ctx.lineTo(POSTCARD_WIDTH - 85, 135);

  ctx.strokeStyle = '#171717';
  ctx.lineWidth = 2;

  ctx.stroke();


  /*
   * Category.
   */
  const category =
    titleCase(record.category);

  if (category) {

    ctx.font =
      '500 25px Arial, Helvetica, sans-serif';

    ctx.fillStyle = '#555';

    ctx.fillText(
      category.toUpperCase(),
      85,
      205
    );
  }


  /*
   * Main title.
   */
  ctx.fillStyle = '#171717';

  ctx.font =
    '700 70px Arial, Helvetica, sans-serif';

  let y = 290;

  y = drawWrappedText(
    ctx,
    record.title || 'Board listing',
    85,
    y,
    1030,
    82,
    4
  );


  /*
   * Details block.
   */
  y += 55;

  ctx.font =
    '600 28px Arial, Helvetica, sans-serif';

  ctx.fillStyle = '#171717';

  const location =
    cleanText(record.location);

  const when =
    cleanText(record.when);

  const where =
    cleanText(record.where);

  if (location) {

    ctx.fillText(
      location,
      85,
      y
    );

    y += 48;
  }

  if (when) {

    ctx.fillText(
      when,
      85,
      y
    );

    y += 48;
  }

  if (where) {

    ctx.fillText(
      where,
      85,
      y
    );

    y += 48;
  }


  /*
   * Offering / seeking.
   */
  const offer =
    cleanText(record.offer);

  if (offer) {

    y += 10;

    ctx.font =
      '600 25px Arial, Helvetica, sans-serif';

    ctx.fillStyle = '#555';

    ctx.fillText(
      offer.toUpperCase(),
      85,
      y
    );

    y += 45;
  }


  /*
   * Main description.
   */
  const description =
    cleanText(record.description);

  if (description) {

    y += 30;

    ctx.font =
      '400 31px Arial, Helvetica, sans-serif';

    ctx.fillStyle = '#171717';

    drawWrappedText(
      ctx,
      description,
      85,
      y,
      1030,
      45,
      8
    );
  }


  /*
   * Central visual divider.
   */
  ctx.beginPath();

  ctx.moveTo(85, 1080);
  ctx.lineTo(POSTCARD_WIDTH - 85, 1080);

  ctx.strokeStyle = '#171717';
  ctx.lineWidth = 2;

  ctx.stroke();


  /*
   * Call to action.
   */
  ctx.fillStyle = '#171717';

  ctx.font =
    '700 34px Arial, Helvetica, sans-serif';

  ctx.fillText(
    'Find it on the Board',
    85,
    1155
  );


  /*
   * URL.
   */
  ctx.font =
    '400 28px Arial, Helvetica, sans-serif';

  ctx.fillStyle = '#555';

  ctx.fillText(
    postcardUrl(record),
    85,
    1205
  );


  /*
   * Footer.
   */
  ctx.fillStyle = '#171717';

  ctx.font =
    '600 28px Arial, Helvetica, sans-serif';

  ctx.fillText(
    'NIAGARA ASSEMBLY',
    85,
    1390
  );

  ctx.font =
    '400 23px Arial, Helvetica, sans-serif';

  ctx.fillStyle = '#555';

  ctx.fillText(
    'Technology • Industry • Commons',
    85,
    1430
  );


  /*
   * Small corner mark.
   *
   * This gives the generated image a recognizable NA visual
   * signature without needing an external logo image.
   */
  ctx.strokeStyle = '#171717';
  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(1080, 1365);
  ctx.lineTo(1120, 1405);
  ctx.lineTo(1080, 1445);

  ctx.stroke();


  return canvas;
}


/* ------------------------------------------------------------------
 * Canvas → JPEG
 * ---------------------------------------------------------------- */

function canvasToBlob(canvas) {

  return new Promise(
    (resolve, reject) => {

      canvas.toBlob(
        blob => {

          if (blob) {
            resolve(blob);
          } else {
            reject(
              new Error(
                'Browser could not create JPEG'
              )
            );
          }
        },
        'image/jpeg',
        0.92
      );
    }
  );
}


/* ------------------------------------------------------------------
 * Filename
 * ---------------------------------------------------------------- */

function postcardFilename(record) {

  const title =
    cleanText(record.title)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 60);

  return `niagara-assembly-${title || 'board'}.jpg`;
}


/* ------------------------------------------------------------------
 * Share / download
 * ---------------------------------------------------------------- */

async function shareOrDownload(blob, filename) {

  const file =
    new File(
      [blob],
      filename,
      {
        type: 'image/jpeg'
      }
    );


  /*
   * On compatible phones/tablets/browsers this gives the user the
   * native share sheet, allowing them to choose an installed social
   * application.
   */
  if (
    navigator.share &&
    navigator.canShare &&
    navigator.canShare({ files: [file] })
  ) {

    try {

      await navigator.share({
        title: 'Niagara Assembly',
        text: 'From the Niagara Assembly Board',
        files: [file]
      });

      return;
    } catch (error) {

      /*
       * Abort is normal if the user closes the share sheet.
       * Do not download a surprise duplicate in that case.
       */
      if (
        error &&
        error.name === 'AbortError'
      ) {
        return;
      }

      console.warn(
        'Native sharing unavailable:',
        error
      );
    }
  }


  /*
   * Desktop browsers and browsers without file sharing fall back
   * to an ordinary JPEG download.
   */
  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement('a');

  link.href = url;
  link.download = filename;

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );
}


/* ------------------------------------------------------------------
 * Create postcard
 * ---------------------------------------------------------------- */

async function createPostcard(record) {

  const canvas =
    drawPostcard(record);

  const blob =
    await canvasToBlob(canvas);

  await shareOrDownload(
    blob,
    postcardFilename(record)
  );
}


/* ------------------------------------------------------------------
 * Load Board data
 * ---------------------------------------------------------------- */

try {

  records =
    await fetch('../data/board.json')
      .then((response) => {

        if (!response.ok) {
          throw new Error(
            `board.json: HTTP ${response.status}`
          );
        }

        return response.json();
      });


  /*
   * Populate location filter.
   */
  const select =
    document.getElementById('f-location');

  for (const name of locationsIn(records)) {

    const option =
      document.createElement('option');

    option.value = name;
    option.textContent = name;

    select.append(option);
  }


  render();


} catch (err) {

  console.error(err);

  nav.innerHTML =
    navHtml(state.category);

  root.innerHTML =
    '<p class="board__empty">The board could not be loaded. Please reload.</p>';
}


/* ------------------------------------------------------------------
 * Safety net for asynchronous DOM changes.
 *
 * If board.js changes the card DOM after render(), this observer
 * gives the postcard controls another chance to attach.
 * ---------------------------------------------------------------- */

const postcardObserver =
  new MutationObserver(() => {

    installPostcardButtons();

  });


postcardObserver.observe(
  root,
  {
    childList: true,
    subtree: true
  }
);

</script>
