<script type="module" src="../assets/js/theme.js"></script>
<script type="module">
  import { navHtml, subnavHtml, mountBoard, parseQuery } from '../assets/js/board.js';
  import { locationsIn, hasOffer } from '../assets/js/nav.js';

  const root = document.getElementById('board');
  const nav = document.getElementById('nav');
  const subnav = document.getElementById('subnav');
  const filters = document.getElementById('filters');

  let records = [];
  let state = parseQuery(location.search);

  /* "Past 7 days" is stored as a day count in the control but as an
     absolute ISO date in the filter, so applyFilters stays a pure
     comparison with no clock of its own. */
  function sinceDate(days) {
    if (!days) return '';
    const d = new Date();
    d.setDate(d.getDate() - Number(days));
    return d.toISOString().slice(0, 10);
  }

  function render() {
    nav.innerHTML = navHtml(state.category);
    subnav.innerHTML = subnavHtml(state.category, state.kind);

    /* Hidden AND cleared: a stale "seeking" left behind while switching to
       News would filter every listing out of a category that has no offer
       to match on. */
    const offerSelect = document.getElementById('f-offer');
    const showOffer = hasOffer(state.category);
    offerSelect.hidden = !showOffer;
    if (!showOffer && state.offer) { offerSelect.value = ''; state.offer = ''; }
    mountBoard(records, state, root);
    /* Cards and nav links are created here, after sketch.js built its
       registry on DOMContentLoaded — so they must be registered, not just
       redrawn. */
    if (window.NASketch) window.NASketch.redraw();
  }

  /* Nav and subnav are real links, so they work without script and can be
     copied and shared. Intercepted here only to avoid a reload. */
  for (const bar of [nav, subnav]) {
    bar.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (!link) return;
      e.preventDefault();
      history.pushState(null, '', link.getAttribute('href'));
      state = { ...parseQuery(location.search),
                q: state.q, offer: state.offer, location: state.location,
                since: state.since, upcoming: state.upcoming };
      render();
    });
  }

  filters.addEventListener('submit', (e) => e.preventDefault());
  filters.addEventListener('input', () => {
    state = {
      ...state,
      q: document.getElementById('f-q').value,
      offer: document.getElementById('f-offer').value,
      location: document.getElementById('f-location').value,
      since: sinceDate(document.getElementById('f-since').value),
      upcoming: document.getElementById('f-upcoming').checked
    };
    render();
  });

  addEventListener('popstate', () => { state = parseQuery(location.search); render(); });

  try {
    records = await fetch('../data/board.json').then((r) => {
      if (!r.ok) throw new Error(`board.json: HTTP ${r.status}`);
      return r.json();
    });

    /* Location is free text, so the filter's options come from what the
       board actually holds rather than from a list that would drift out
       of step with the form. */
    const select = document.getElementById('f-location');
    for (const name of locationsIn(records)) {
      const o = document.createElement('option');
      o.value = name; o.textContent = name;
      select.append(o);
    }

    render();
  } catch (err) {
    /* Say so rather than leaving "Loading…" up forever — a stuck spinner
       is indistinguishable from an empty board. */
    console.error(err);
    nav.innerHTML = navHtml(state.category);
    root.innerHTML = '<p class="board__empty">The board could not be loaded. Please reload.</p>';
  }
</script>
