      aria-label="Search"
    >

    <select
      name="offer"
      id="f-offer"
      aria-label="Offering or seeking"

      <option value="">Offering &amp; seeking</option>

      <option value="seeking">Seeking</option>
    </select>

    <select
      name="location"
      id="f-location"
      aria-label="Location"
    >
      <option value="">Anywhere</option>
    </select>

    <select
      name="since"
      id="f-since"
      aria-label="Posted"
    >

      <option value="7">Past 7 days</option>
      <option value="30">Past 30 days</option>

    <label class="check">

        type="checkbox"
        name="upcoming"
        id="f-upcoming"

<script type="module">

import {
  navHtml,
  subnavHtml,
  mountBoard,
  parseQuery
} from '../assets/js/board.js';

import {
  locationsIn,
  hasOffer
} from '../assets/js/nav.js';


/* ------------------------------------------------------------------
 * Board state
 * ------------------------------------------------------------------ */

const root = document.getElementById('board');
const nav = document.getElementById('nav');
const subnav = document.getElementById('subnav');
const filters = document.getElementById('filters');

let records = [];
let state = parseQuery(location.search);


/* ------------------------------------------------------------------
 * Text normalization
 * ------------------------------------------------------------------ */

function normalizeText(value) {
  if (typeof value !== 'string') return value;

  return value
    .replace(/\\n/g, '\n')
    .replace(/\/n/g, '\n')
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n');
}

function normalizeRecord(record) {
  const normalized = {};

  for (const [key, value] of Object.entries(record || {})) {
    normalized[key] =
      typeof value === 'string'
        ? normalizeText(value)
        : value;
  }

  return normalized;
}


/* ------------------------------------------------------------------
 * Filtering
 * ------------------------------------------------------------------ */

function sinceDate(days) {
  if (!days) return '';

  const d = new Date();
  d.setDate(d.getDate() - Number(days));

  return d.toISOString().slice(0, 10);
}


/* ------------------------------------------------------------------
 * Rendering
 * ------------------------------------------------------------------ */

function render() {
  nav.innerHTML = navHtml(state.category);

  subnav.innerHTML = subnavHtml(
    state.category,
    state.kind
  );

  const offerSelect =
    document.getElementById('f-offer');

  const showOffer =
    hasOffer(state.category);

  offerSelect.hidden = !showOffer;

  if (!showOffer && state.offer) {
    offerSelect.value = '';
    state.offer = '';
  }

  document.getElementById('f-q').value =
    state.q || '';

  offerSelect.value =
    state.offer || '';

  document.getElementById('f-location').value =
    state.location || '';

  document.getElementById('f-upcoming').checked =
    Boolean(state.upcoming);

  mountBoard(
    records,
    state,
    root
  );

  if (window.NASketch) {
    window.NASketch.redraw();
  }
}


/* ------------------------------------------------------------------
 * Navigation
 * ------------------------------------------------------------------ */

for (const bar of [nav, subnav]) {
  bar.addEventListener('click', (e) => {
    const link = e.target.closest('a');

    if (!link) return;

    e.preventDefault();

    history.pushState(
      null,
      '',
      link.getAttribute('href')
    );

    const next = parseQuery(location.search);

    state = {
      ...next,

      q: state.q,
      offer: state.offer,
      location: state.location,
      since: state.since,
      upcoming: state.upcoming
    };

    render();
  });
}


/* ------------------------------------------------------------------
 * Filters
 * ------------------------------------------------------------------ */

filters.addEventListener(
  'submit',
  (e) => e.preventDefault()
);

filters.addEventListener(
  'input',
  () => {
    state = {
      ...state,

      q:
        document.getElementById('f-q').value,

      offer:
        document.getElementById('f-offer').value,

      location:
        document.getElementById('f-location').value,

      since:
        sinceDate(
          document.getElementById('f-since').value
        ),

      upcoming:
        document.getElementById('f-upcoming').checked
    };

    render();
  }
);


/* ------------------------------------------------------------------
 * Browser history
 * ------------------------------------------------------------------ */

addEventListener(
  'popstate',
  () => {
    state = parseQuery(location.search);
    render();
  }
);


/* ------------------------------------------------------------------
 * Load Board data
 * ------------------------------------------------------------------ */

try {
  records = await fetch('../data/board.json')
    .then(async (response) => {
      if (!response.ok) {
        throw new Error(
          `board.json: HTTP ${response.status}`
        );
      }

      const data = await response.json();

      return Array.isArray(data)
        ? data.map(normalizeRecord)
        : [];
    });

  const select =
    document.getElementById('f-location');

  for (const name of locationsIn(records)) {
    const option =
      document.createElement('option');

    option.value = name;
    option.textContent = name;

    select.append(option);
  }

  render();

} catch (err) {
  console.error(err);

  nav.innerHTML =
    navHtml(state.category);

  root.innerHTML =
    '<p class="board__empty">' +
    'The board could not be loaded. Please reload.' +
    '</p>';
}

</script>
