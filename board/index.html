```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="The Niagara Assembly Board — events, news, spaces, tools, and experts across the region."
  >

  <title>Board — Niagara Assembly</title>

  <link rel="stylesheet" href="../assets/css/site.css">

  <style>
    /*
     * Board-specific controls.
     *
     * The postcard itself is generated by assets/js/postcard.js.
     * Board cards and their buttons are managed by assets/js/board.js.
     */

    .board-postcard {
      margin-top: 1rem;
    }

    .board-postcard__button {
      appearance: none;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.9rem;
      line-height: 1;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
    }

    .board-postcard__button:hover {
      background: currentColor;
      color: var(--bg, Canvas);
    }

    .board-postcard__button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .board-postcard__button:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }
  </style>
</head>

<body>

  <header class="topnav">
    <a class="topnav__brand" href="/">
      @NiagaraAssembly
    </a>

    <nav
      id="topnav"
      class="topnav__links"
      aria-label="Primary navigation"
    ></nav>
  </header>

  <main class="page board-page">

    <header class="board__header">
      <div
        id="board-nav"
        class="board__nav"
        aria-label="Board categories"
      ></div>

      <div
        id="board-subnav"
        class="board__subnav"
        aria-label="Board subcategories"
      ></div>
    </header>

    <section
      class="board__filters"
      aria-label="Filter the board"
    >
      <label>
        <span>Location</span>

        <select id="f-location">
          <option value="">All locations</option>
        </select>
      </label>

      <label>
        <span>Offer</span>

        <select id="f-offer">
          <option value="">All offers</option>
          <option value="for-sale">For sale</option>
          <option value="for-rent">For rent</option>
          <option value="free">Free</option>
          <option value="wanted">Wanted</option>
          <option value="available">Available</option>
        </select>
      </label>
    </section>

    <section
      id="board"
      class="board"
      aria-live="polite"
      aria-busy="true"
    >
      <p class="board__empty">
        Loading the board…
      </p>
    </section>

  </main>

  <footer class="site-footer">
    <a href="/">Niagara Assembly</a>
  </footer>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/sketch.js"></script>

  <script type="module">
    import {
      navHtml,
      subnavHtml,
      mountBoard,
      parseQuery
    } from "../assets/js/board.js";

    import {
      locationsIn,
      hasOffer
    } from "../assets/js/nav.js";

    import {
      attachPostcardButtons
    } from "../assets/js/postcard.js";

    const root = document.getElementById("board");
    const nav = document.getElementById("board-nav");
    const subnav = document.getElementById("board-subnav");
    const locationSelect = document.getElementById("f-location");
    const offerSelect = document.getElementById("f-offer");

    let records = [];

    const state = parseQuery();

    /*
     * Keep filter changes URL-addressable.
     * This preserves the existing Board query-string behaviour.
     */
    function updateQuery() {
      const params = new URLSearchParams(window.location.search);

      if (state.category) {
        params.set("category", state.category);
      } else {
        params.delete("category");
      }

      if (state.kind) {
        params.set("kind", state.kind);
      } else {
        params.delete("kind");
      }

      if (state.location) {
        params.set("location", state.location);
      } else {
        params.delete("location");
      }

      if (state.offer) {
        params.set("offer", state.offer);
      } else {
        params.delete("offer");
      }

      const query = params.toString();

      const url =
        window.location.pathname +
        (query ? `?${query}` : "");

      window.history.replaceState({}, "", url);
    }

    function render() {
      nav.innerHTML = navHtml(state.category);
      subnav.innerHTML =
        subnavHtml(state.category, state.kind);

      const showOffer = hasOffer(state.category);

      offerSelect.hidden = !showOffer;

      if (!showOffer) {
        offerSelect.value = "";
        state.offer = "";
      }

      /*
       * board.js owns the actual Board records/cards.
       *
       * It receives the postcard callback so that the postcard
       * button can be attached to the exact card corresponding
       * to the exact record being rendered.
       */
      mountBoard(
        records,
        state,
        root,
        {
          onCardMounted: (card, record) => {
            attachPostcardButtons(
              card,
              record
            );
          }
        }
      );

      updateQuery();

      root.setAttribute("aria-busy", "false");

      if (window.NASketch) {
        window.NASketch.redraw();
      }
    }

    locationSelect.addEventListener(
      "change",
      () => {
        state.location =
          locationSelect.value;

        render();
      }
    );

    offerSelect.addEventListener(
      "change",
      () => {
        state.offer =
          offerSelect.value;

        render();
      }
    );

    /*
     * Keep browser Back/Forward navigation useful.
     */
    window.addEventListener(
      "popstate",
      () => {
        const next = parseQuery();

        state.category = next.category;
        state.kind = next.kind;
        state.location = next.location;
        state.offer = next.offer;

        locationSelect.value =
          state.location || "";

        offerSelect.value =
          state.offer || "";

        render();
      }
    );

    try {
      const response =
        await fetch("../data/board.json");

      if (!response.ok) {
        throw new Error(
          `board.json: HTTP ${response.status}`
        );
      }

      records = await response.json();

      /*
       * Populate the location filter once from the
       * complete record set.
       */
      for (
        const name of locationsIn(records)
      ) {
        const option =
          document.createElement("option");

        option.value = name;
        option.textContent = name;

        locationSelect.append(option);
      }

      locationSelect.value =
        state.location || "";

      offerSelect.value =
        state.offer || "";

      render();

    } catch (error) {
      console.error("board:", error);

      root.setAttribute(
        "aria-busy",
        "false"
      );

      root.innerHTML = `
        <p class="board__empty">
          The board could not be loaded.
          Please reload.
        </p>
      `;
    }
  </script>

</body>
</html>
```
