<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Between the lakes — Regional sketch</title><style>
@font-face{font-family:Sketch;src:url('../../assets/fonts/comic-neue-latin-400-normal.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6f3;color:#252b29;font:16px/1.5 Sketch,system-ui}body.dark{background:#16171a;color:#e9e7e2}header{padding:20px 28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #a8aca5}header a{color:inherit}h1{font-size:20px;margin:0;margin-right:auto}.controls{display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:transparent;border:1px solid #a8aca5;padding:5px 12px;cursor:pointer}.viewport{overflow:auto;height:calc(100vh - 155px);min-height:400px;cursor:grab}.viewport.dragging{cursor:grabbing}.viewport img{display:block;width:100%;max-width:none;user-select:none}footer{padding:12px 28px;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}footer a{color:inherit}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid currentColor;outline-offset:3px}</style></head>
<body><header><h1>Between the lakes. / Regional sketch 01</h1><a href="/">Home</a><div class="controls"><button id="out" aria-label="Zoom out">−</button><select id="zoom" aria-label="Map zoom"><option value="1">Fit</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option></select><button id="in" aria-label="Zoom in">+</button><button id="theme">Dark mode</button></div></header>
<div class="viewport" tabindex="0" role="region" aria-label="Scrollable regional sketch"><img id="map" src="region.svg" alt="Regional schematic with 106 places and selected road connections from Hamilton and Niagara through Buffalo to Rochester and Syracuse, south to Erie and the Finger Lakes. Blue lakes, thin roads, and labeled settlement dots." draggable="false"></div>
<footer><span>106 places · 27 connection chains · Schematic, not for navigation</span><a id="svg" href="region.svg" download>Download SVG</a><a href="region.png" download>Download 4800px PNG</a><a href="README.md">Sources &amp; drawing notes</a></footer>
<script>
const map=document.querySelector('#map'),zoom=document.querySelector('#zoom'),viewport=document.querySelector('.viewport');function resize(){map.style.width=`${Number(zoom.value)*100}%`}zoom.addEventListener('change',resize);document.querySelector('#in').onclick=()=>{zoom.selectedIndex=Math.min(zoom.options.length-1,zoom.selectedIndex+1);resize()};document.querySelector('#out').onclick=()=>{zoom.selectedIndex=Math.max(0,zoom.selectedIndex-1);resize()};document.querySelector('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');map.src=dark?'region-dark.svg':'region.svg';document.querySelector('#svg').href=map.src;document.querySelector('#theme').textContent=dark?'Light mode':'Dark mode'};let drag;viewport.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging')});viewport.addEventListener('pointermove',e=>{if(!drag)return;viewport.scrollLeft=drag.left+drag.x-e.clientX;viewport.scrollTop=drag.top+drag.y-e.clientY});for(const event of ['pointerup','pointercancel'])viewport.addEventListener(event,()=>{drag=null;viewport.classList.remove('dragging')});
</script></body></html>
